name: cicd

# Builds and tests all projects. On a tag (e.g. "1.0.0") all packages are published with the tag as version:
# Samhammer.AspNetCore.StringTrimming, Samhammer.AspNetCore.StringTrimming.SystemTextJson, Samhammer.AspNetCore.StringTrimming.NewtonsoftJson

on:
  push:
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: olegtarasov/get-tag@v2.1.4
        id: tag
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: echo "::remove-matcher owner=csc::"
      - uses: reviewdog/action-setup@v1
      - run: dotnet --info
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore | tee dotnet.buildlog
      - uses: SamhammerAG/dotnet-reviewdog-action@v2
        if: github.event_name != 'workflow_dispatch'
        with:
          workdir: src
          level: error
          fail_on_error: true
          reporter: github-check
          line_exclude_regex: ".*(warning|error) CS0618:.*"
      - uses: SamhammerAG/nuget-license-check-action@v2.0
        with:
          projectDir: "src"
          solutionFileName: Samhammer.AspNetCore.StringTrimming.sln
          allowedLicenses: "MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;MS-PL"
          exportDir: "src"
      - run: dotnet test -c Release --no-build --report-github
      # PUBLISH nuget packages
      - run: dotnet pack -c Release -p:Version=${{ steps.tag.outputs.tag || '0.0' }} --output nuget-packages
      - if: startsWith(github.ref, 'refs/tags/')
        run: cd nuget-packages; dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate --source https://api.nuget.org/v3/index.json
